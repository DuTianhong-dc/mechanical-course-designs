# ================================================================
# 螺旋弹簧 · 参数文件（公式驱动版）★ 本文件 = 唯一参数源
#
# 规则：
#   ① 「独立参数」= 直接填数字
#   ② 「派生参数」= 填以 "=" 开头的表达式字符串，如 "= 自由高 - 最大工作变形"
#   ③ 表达式可引用其他参数中文名；数学函数用 math.xxx
#   ④ 单位：长度 mm｜载荷 N｜应力 MPa｜刚度 N/mm
#   ⑤ ★ 中文 key 与表达式字符串都要加引号
#
# 导出到 SolidWorks：
#   跑  04_脚本/导出方程式.py 10_螺旋弹簧.toml  →  生成  03_模型/螺旋弹簧_参数.txt
#   ★ 必须带文件名 —— 脚本不提供「全量导出」：每次导出只针对指定零件，避免误伤其它 txt
#   那个 txt 是【生成物】：SW 把它链接成外部方程式文件后，一旦在 SW 里改值，
#   SW 会导出覆盖它（方程式保留、注释与非方程式行全丢）。
#   ★ 所以不要在 txt 里手写任何东西——被覆盖了重跑脚本即可完全恢复。
#   导出范围默认 ["几何"] 区；如需调整，在本文件加：
#       ["_导出"]
#       "分区" = ["几何"]
# ================================================================

["几何"]
"中径" = 118.0                # mm  独立：弹簧中径 D
"线径" = 13.5                 # mm  独立：弹簧线径 d
"自由高" = 330.0              # mm  独立：磨平后总高 H₀
"有效圈数" = 6.0              # —   独立：有效圈数 n
"每端并紧圈数" = 1.0           # —   独立：死圈
"磨平切入系数" = 0.25          # ×d  独立：端面切入 = 0.25d
"磨平覆盖圈数" = 0.75          # 圈  独立：磨面角 ≥ 270°

"旋绕比_c" = "= 中径 / 线径"
"有效段节距_p" = "= (自由高 - 1.5 * 线径) / 有效圈数"
"总圈数" = "= 有效圈数 + 2 * 每端并紧圈数"
"并紧段螺距" = "= 线径"
"曲线跨度" = "= 自由高 + 0.5 * 线径"
"端面切入量" = "= 磨平切入系数 * 线径"
"压并高度" = "= (总圈数 - 0.5) * 线径"

["材料"]
"牌号" = "60Si2MnA"           # GB/T 1222（设计牌号，图纸与计算书用此名）
"SW材质" = "60Si2MnA弹簧钢"    # SW 自定义材质库里的名字（04_脚本/建材料.py 生成）
                              #   库名带中文后缀，与上面的设计牌号不同名，故这里必须写全
"弹性模量_G" = 79000.0         # MPa
"抗拉强度下限" = 1650.0        # MPa
"密度" = 7.85e-6              # kg/mm³
"许用切应力系数" = 0.46        # [τ] = 0.46σb
"极限切应力系数" = 0.65        # [τ]max = 0.65σb

["工况"]
"满载静载荷" = 4963.0         # N
"最大工作变形" = 195.3         # mm
"压缩后剩余高度" = "= 自由高 - 最大工作变形"

["校核"]
"曲度系数" = "= (4 * 旋绕比_c + 2) / (4 * 旋绕比_c - 3)"
"弹簧刚度" = "= 弹性模量_G * 线径**4 / (8 * 中径**3 * 有效圈数)"
"静载切应力" = "= 8 * 满载静载荷 * 中径 * 曲度系数 / (math.pi * 线径**3)"
"静压缩量" = "= 满载静载荷 / 弹簧刚度"
# 极限工况：F_max = 弹簧刚度 × 最大工作变形（≈6.50 kN），代入同一应力公式
"极限切应力" = "= 8 * (弹簧刚度 * 最大工作变形) * 中径 * 曲度系数 / (math.pi * 线径**3)"
# 注：安全系数按"许用/工作"口径；计算书 03 节列的 1.90/2.30 系另一口径，待统一后更新
"静载安全系数" = "= 许用切应力系数 * 抗拉强度下限 / 静载切应力"
"极限安全系数" = "= 极限切应力系数 * 抗拉强度下限 / 极限切应力"
"展开长度" = "= 2 * math.hypot(math.pi * 中径, 线径) + 有效圈数 * math.hypot(math.pi * 中径, 有效段节距_p)"
"单件质量_kg" = "= 展开长度 * math.pi * (线径 / 2)**2 * 密度"

["建模"]
"每圈离散点数" = 48            # 螺旋线离散精度（36~72）
"扫掠截面" = "圆形"
"端面处理" = "平面切除"
"坐标约定" = "轴线沿 +Y，底端 Y=0"
