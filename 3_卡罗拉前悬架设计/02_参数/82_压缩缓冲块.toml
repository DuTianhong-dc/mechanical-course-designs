# ================================================================
# 压缩缓冲块 · 参数文件（公式驱动版）★ 本文件 = 唯一参数源
#
# 属【支柱上部】五件之一（用户  定）
# 建立：（从原 81_活塞.toml 拆出）
#
# ★ 装在哪、干什么：
#   套在活塞杆上、整体位于螺旋弹簧内腔，上端抵住上弹簧座的下表面。
#   压缩时被"上座底面 ↔ 筒体上端面"夹住压溃，起【末端限位】作用，
#   避免弹簧压并、减振器打底。材料为高弹性微孔聚氨酯。
#
# ★★ 自由高 30（ 用户确认无问题）
#   依据 03_螺旋弹簧设计.md 的行程分配：「弹性段 50 + 缓冲块段 20」，
#   即缓冲块在弹簧弹性段走完（弹簧压缩 46.5 = 50 × 杠杆比 0.93）时介入。
#
#   ★★ 关键结构（用户  指出，本表原先没考虑到）：
#       **上弹簧座是锥形的** —— 缓冲块上端有【一大部分伸进上座的锥形腔】里，
#       被锥形吸收，**不额外占用轴向距离**。
#       → 所以不能用"平板式"的算法（台阶面到筒口 − 自由高）去校核它的空间。
#
# ★ 接口（改一处要改两处）：
#     外径 φ60  ←→  83_上弹簧座.toml「中心孔下段直径」（缓冲块上端插入该孔定心）
#     内孔 φ16  ←→  81_活塞杆.toml「活塞杆直径」φ15（单边 0.5 间隙）
#
# ★ 取值口径：只给【基本尺寸】；配合、公差、粗糙度留到标注阶段。
#
# 规则：① 独立=填数字 ② 派生=填 "= 表达式" ③ 幂用 **（导出时自动转 ^）
#       ④ 单位 mm ｜ ⑤ 中文 key 与表达式都要加引号
# 导出：04_脚本/导出方程式.py 82_压缩缓冲块.toml → 03_模型/压缩缓冲块_参数.txt
# ================================================================

["几何"]
# ★★ ：本节【以 03_模型/压缩缓冲块_参数.txt 为准】—— 变量名、公式、数值
#    全部照用户在 SW 里手改的那一版录入（用户："依照 .txt 文件更新上游"）。
"活塞杆直径" = 15.0          # mm  ★ 接口 = 81_活塞杆.toml
"间隙" = 0.5                 # mm  与活塞杆的单边配合间隙
"缓冲块外径" = 60.0          # mm  外轮廓
"缓冲块内孔" = "= 活塞杆直径 + 2 * 间隙"     # → 16（ 用户更正：内孔走公式，外径给硬值）
"缓冲块自由高" = 30.0        # mm  ★ 由装配空间反推，见文件头

["材料"]
"缓冲块材料" = "微孔聚氨酯（PU）"     # 高弹性、可压缩性大、回弹好；邵氏 A 70~90

["_校验"]
"内孔小于外径" = "= 缓冲块内孔 < 缓冲块外径"
"内孔配杆" = "= 缓冲块内孔 > 活塞杆直径"
"自由高为正" = "= 缓冲块自由高 > 0"


