# ================================================================
# 内端衬套总成（橡胶衬套） · 参数文件（公式驱动版）★ 本文件 = 唯一参数源
#
# 来源：设计计算书 06 节 §6.4.1「内端铰接：衬套总成（5 层）＋ 焊接衬管」
# 建立：
#
# ★ 范围：本表只含【衬套总成】= ② 内金属套 + ③ 橡胶层 + ④ 外金属套 → 单独出图。
#   不含：① 贯穿螺栓（标准件 M14×1.5，10.9 级）
#         ⑤ 摆臂孔 / 衬管内孔（属下摆臂，见 20_下摆臂.toml）
#   用量：**2 件/车**（内端两个铰点 P2 / P3 各一，两件完全相同）
#
# ★ 装配层次（由内向外，装配后）：
#        M14 螺栓 → 内金属套 → 橡胶层 → 外金属套 → 摆臂衬管内孔
#        φ14 杆     φ14.5×φ20   φ20→φ28  φ28→φ32     φ32（过盈）
#
# ★ 三层【轴向长度】关系（ 用户给定）—— 两端【阶梯式外伸】，不是内缩：
#        外金属套(最短) = 内衬管长（= 实际件 65）
#        < 橡胶层(居中，每端伸出 1) = 67
#        < 内金属套(最长，每端伸出 4) = 73
#   理由：
#     ① 内金属套最长 —— 伸出段落在【车架铰接架的耳板】内，靠贯穿螺栓夹紧固定，
#        衬套的扭转反力全部由它传给车架；
#     ② 橡胶层居中 —— 只比外套长一点点，把外套端面与车架耳板【隔开】，
#        避免金属-金属直接接触产生碰撞异响；
#     ③ 外金属套最短 —— 与内衬管等长，只负责与摆臂的过盈配合面。
#
# ★ 接口（须与 20_下摆臂.toml 一致，**改一处必须改两处**）：
#       本表「外套外径」32  ←→  20_下摆臂.toml「内衬管内孔」32（过盈配合面）
#
# ★ 分工：橡胶层承担【扭转变形与减振】（摆臂绕铰点的摆动由橡胶剪切变形吸收），
#   内外金属套只传递径向/轴向载荷并保证压装与配合面尺寸稳定。
#
# 规则：
#   ① 「独立参数」= 直接填数字 ｜ ② 「派生参数」= 填 "= 表达式"
#   ③ 表达式用 Python 语法（幂用 **，脚本导出时自动转成 SW 的 ^）
#   ④ 单位：长度 mm｜力 N｜应力 MPa｜密度 kg/mm³
#   ⑤ ★ 中文 key 与表达式字符串都要加引号
#
# 导出到 SolidWorks：跑 04_脚本/导出方程式.py 40_衬套.toml
#   → 03_模型/衬套_参数.txt（生成物，勿手改）
# ================================================================

["几何"]
# ─────── 独立参数（设计输入 / 接口尺寸）───────
"内套内孔" = 14.5            # mm  配 M14×1.5 贯穿螺栓，单边留 0.25 微间隙
"内套外径" = 20.0            # mm  同时是橡胶层内径
"橡胶层厚" = 4.0             # mm  橡胶径向厚度（决定径向刚度与扭转柔性）
"外套外径" = 32.0            # mm  ★ 接口：= 下摆臂「内衬管内孔」φ32（过盈配合面）
"衬套外层长" = 65.0          # mm  ★ 接口：= 20_下摆臂.toml 的「内衬管长」= 65（两表已一致）
"内层端部伸出量" = 4.0       # mm  内金属套每端【伸出】外套的长度（伸进车架铰接架耳板被夹紧）
"橡胶端部伸出量" = 1.0       # mm  橡胶层每端【伸出】外套的长度（隔开外套端面与车架耳板，防异响）

# ─────── 派生：径向尺寸链（闭合自检见 _校验）───────
"内套壁厚" = "= (内套外径 - 内套内孔) / 2"                 # → 2.75
"橡胶内径" = "= 内套外径"                                  # → 20
"橡胶外径" = "= 内套外径 + 2 * 橡胶层厚"                    # → 28
"外套内径" = "= 橡胶外径"                                  # → 28
"外套壁厚" = "= (外套外径 - 外套内径) / 2"                  # → 2

# ─────── 派生：轴向长度链（外套 < 橡胶 < 内套，两端不对称则另说；自检见 _校验）───────
"外套长度" = "= 衬套外层长"                                # → 65
"橡胶长度" = "= 衬套外层长 + 2 * 橡胶端部伸出量"              # → 67
"内套长度" = "= 衬套外层长 + 2 * 内层端部伸出量"              # → 73

# ─────── 派生：配合间隙（与贯穿螺栓）───────
"螺栓公称直径" = 14.0         # mm  M14 大径
"螺栓单边间隙" = "= (内套内孔 - 螺栓公称直径) / 2"           # → 0.25
"螺栓孔径比" = "= 内套内孔 / 螺栓公称直径"                   # 微间隙判据，应 ≈1.03

["材料"]
"内套材料" = "20号优质碳素结构钢 无缝钢管"     # GB/T 699 优质碳素结构钢，可焊/易加工
"外套材料" = "20号优质碳素结构钢 无缝钢管"     # 同内套，便于同批加工与压装
"内套外套_屈服" = 245.0        # MPa  20号钢 σs 下限

# ─────── 橡胶层（ 按行业通用档落实，SW 材质库已建同名材料）───────
"橡胶牌号" = "NR（天然橡胶），60±5 Shore A"   # GB/T 5576 代号 NR
"橡胶_SW材质" = "天然橡胶（NR60）"     # SW 自定义材质库里的名字（04_脚本/建材料.py 生成）
"橡胶硬度_ShA" = 60.0           # Shore A  行业通用档：
                              #   OEM 舒适取向衬套取 50~60（改装强化件才 65~70）
# 模量出处：《机械设计手册》橡胶材料「静弹性特性」
#   式 3.4-62  G = 0.117 · e^(0.034·Hs)  MPa（G 只随硬度变，与胶种配方基本无关）
#   式 3.4-61  E = 3G（橡胶近似不可压缩，ν≈0.5）
#   Hs=60 → G=0.8998、E=2.6985 MPa。★该式自检：Hs=45/50 → 0.540/0.640，与手册算例逐位一致
"橡胶_剪切模量_G" = 0.8998      # MPa  派生自硬度，此处直填（与 SW 材质库取值一致）
"橡胶_弹性模量_E" = 2.6985      # MPa
"橡胶_泊松比" = 0.4995          # 取 0.4995 而非 0.5，避免有限元出现不可压缩奇异
"橡胶密度" = 1.15e-6            # kg/mm³  = 1150 kg/m³（NR 60A 实测比重 1.15±0.03）
"橡胶_抗拉强度" = 22.0          # MPa  NR 60A 抗拉下限
# ⚠️ 以上 E/ν 线性弹性只是粗近似（橡胶非线性、Mullins 效应、粘弹性均未体现）；
#    要做精确强度/刚度分析须换超弹性本构（Mooney-Rivlin / Ogden）。
"钢密度" = 7.85e-6            # kg/mm³

["校核"]
# 体积 / 质量（几何派生，不涉及强度）—— 三层【长度各不相同】，各用各自的长
"内套体积" = "= math.pi / 4 * (内套外径 ** 2 - 内套内孔 ** 2) * 内套长度"
"外套体积" = "= math.pi / 4 * (外套外径 ** 2 - 外套内径 ** 2) * 外套长度"
"橡胶体积" = "= math.pi / 4 * (橡胶外径 ** 2 - 橡胶内径 ** 2) * 橡胶长度"
"内套质量" = "= 内套体积 * 钢密度"
"外套质量" = "= 外套体积 * 钢密度"
"橡胶质量" = "= 橡胶体积 * 橡胶密度"
"单件质量_g" = "= (内套质量 + 外套质量 + 橡胶质量) * 1000"

["待补"]   # ⚠️ 以下计算书未给，定稿前必须补齐（本区不导出到 SW）
"过盈量" = ""                 # 外套外径 φ32 压入衬管内孔 φ32 的过盈量（μm）→ 决定压出力与接触压力
"橡胶许用剪应变" = ""          # 摆臂全行程摆角对应橡胶层的剪切应变，需 ≤ 许用
"目标径向刚度" = ""            # N/mm，需与整车操纵稳定性/平顺性匹配
"车架耳板跨距" = ""            # ★ 车架铰接架两耳板【内侧面净距】，必须 = 内套长度 73
                              #   （否则装不进 or 夹不紧）。这是核心装配接口，务必落实。
"橡胶端面与耳板间隙" = ""       # 橡胶每端伸出 1 后，与耳板内侧面的实际间隙（0 则失去隔振作用）
"漏液/异响要求" = ""           # 主机厂通常要求

["_校验"]
# 径向尺寸链自检：外套外径必须等于「内套外径 + 2×橡胶层厚 + 2×外套壁厚」
#   ⚠️ 求值器清空了 __builtins__，只能用 math. 里的函数（没有裸 abs）
"径向尺寸链闭合" = "= math.fabs(外套外径 - (内套外径 + 2 * 橡胶层厚 + 2 * 外套壁厚)) < 1e-9"
# 接口一致性：外套外径必须 = 下摆臂「内衬管内孔」32（两表分开维护，此处守住）
"接口_外套外径=32" = "= 外套外径 == 32.0"
# 接口一致性：外套长度必须 = 内衬管长【实际件 65】
"接口_外套长度=65" = "= 外套长度 == 65.0"
# 轴向长度阶梯：外套 < 橡胶 < 内套（两端阶梯式外伸，方向不能反）
"长度阶梯正确" = "= 外套长度 < 橡胶长度 < 内套长度"
# 与螺栓的微间隙应落在 0.1 ~ 0.5 mm 单边
"螺栓间隙合理" = "= 0.1 <= 螺栓单边间隙 <= 0.5"
# 两层金属套壁厚应满足车削 + 压装工艺下限
"内套壁厚合理" = "= 内套壁厚 >= 1.5"
"外套壁厚合理" = "= 1.5 <= 外套壁厚 <= 4.0"
# 橡胶层厚应 ≥ 3（过薄则扭转柔性不足、易撕裂）
"橡胶层厚合理" = "= 橡胶层厚 >= 3.0"
