["几何"]
# ─────── 活塞杆本体 ───────
"活塞杆直径" = 15.0          # mm  第 6 节；调质后表面镀硬铬
"杆端螺纹公称直径" = 14.0    # mm  M14×1.5（在 φ15 杆端滚压成形）
"杆端螺纹螺距" = 1.5         # mm
"螺纹段长" = 20.0            # mm   用户由 46 定为 20
                             #   ★ 螺纹段只需覆盖【防松垫片 3 + 锁紧螺母 12.8 = 15.8】
                             #     —— 穿过顶胶那一段是【光杆】，不车螺纹，20 够用 ✓
"活塞杆总长" = 250.0         # mm   用户由 307 定为 250

["材料"]
"活塞杆材料" = "40Cr合金结构钢"      # SW 材质库同名；调质 + 表面镀硬铬

["_校验"]
"杆端螺纹比杆细" = "= 杆端螺纹公称直径 < 活塞杆直径"
"螺纹段不超杆长" = "= 螺纹段长 < 活塞杆总长"
# 螺纹段至少要够穿过防松垫片与锁紧螺母（尺寸取自 90_标准件.toml）
# 注：顶胶那一段的余量见文件头推导，不在这里校核
"螺纹段长于垫片加螺母" = "= 螺纹段长 > 防松垫片厚 + M14螺母厚"


