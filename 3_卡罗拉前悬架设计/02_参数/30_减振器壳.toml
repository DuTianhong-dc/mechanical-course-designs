# ================================================================
# 减振器壳（筒身组件） · 参数文件（公式驱动版）★ 本文件 = 唯一参数源
#
# 来源：设计计算书第 7 节 ｜ 修订：
# 零件构成：筒体 + 底盖 + 弹簧盘 + 下支架（焊接壳体件，整体出图）
#
# 规则：
#   ① 「独立参数」= 直接填数字
#   ② 「派生参数」= 填以 "=" 开头的表达式字符串，如 "= 筒体外径 - 2 * 筒体壁厚"
#   ③ 表达式可引用中文参数名；数学函数用 math.xxx
#   ④ 单位：长度 mm｜力 N｜应力 MPa
#
# 导出到 SolidWorks：
#   跑  04_脚本/导出方程式.py 30_减振器壳.toml  →  生成  03_模型/减振器壳_参数.txt
#   ★ 必须带文件名 —— 脚本不提供「全量导出」：每次导出只针对指定零件，避免误伤其它 txt
#   那个 txt 是【生成物】：SW 链接后可能导出覆盖它（注释会丢），被覆盖了重跑脚本即可。
#   ★ 不要在 txt 里手写任何东西。
# ================================================================

["几何"]
# ─────── 筒体（冷拔精密钢管）───────
"筒体外径" = 46.0            # mm  第 4 节：工作缸 φ30 + 油腔 + 壁厚 2 → 内径 φ42
"筒体壁厚" = 2.0             # mm
"筒体长" = 340.0             # mm  底端面到顶端面（底盖另计）
                             #   ★  由 300 改 340（用户据实车比例定）：
                             #     依据「H₁/H₂ = 0.15~0.25，主流 0.18~0.22」——
                             #       H₁ = 外筒顶端导向块上端面 → 弹簧上座下表面
                             #       H₂ = 弹簧下支承面 → 弹簧上支承面 = 弹簧静载安装长 181.2
                             #     筒体 340 → H₁ = 372.2 − 340 = 32.2 → 比例 0.178 ✓ 落在主流区间
                             #     （筒体 300 时 H₁ = 72.2 → 比例 0.398，明显偏大 ✗）

# ─────── 底盖 ───────
"底盖厚" = 4.0               # mm  位于【筒体最下端面】，与筒体焊接（或一体缩口封底），内承底阀

# ─────── 弹簧盘（下弹簧座）───────
"弹簧盘外径" = 135.0         # mm  盘的外缘（弹簧外径 φ131.5，外缘再富余 3.5）
"弹簧盘中心孔" = 46.0        # mm  ★ 套在筒体上焊接的孔，配筒体外径 φ46（双面角焊缝 4）
"弹簧盘承载面内缘" = 105.0    # mm  承载平面的内边界（弹簧内径 104.5，接触从这起算）
                             #   ⚠ 这【不是】盘的孔径！盘的中心孔是 φ46。
                             #     计算书原文"内缘 φ105 起承弹簧"容易被误读成孔径，建模时别搞混。
"弹簧盘厚" = 6.0             # mm
"弹簧盘位置" = 191.0         # mm  距筒体底端（量到承载面 = 盘顶面）
                             #   ★★  由 154 改 191 —— 为了让缓冲块在
                             #      【弹簧弹性段走完（压缩 46.5）】时才介入（03 节口径）。
                             #   推导：台阶面到筒口需 76.5（= 弹性段 46.5 + 缓冲块自由高 30）
                             #         − 上座阶梯孔下段深 4  →  上座面到筒口 72.5
                             #         →  上座面 = 300 + 72.5 = 372.5
                             #         − 弹簧满载装配长 181.2  →  191.3 ≈ 191
                             #   实际落点：上座面 372.2 ｜ 台阶面 376.2 ｜ 台阶面到筒口 76.2
                             #             ｜ 缓冲块下端 346.2 ｜ 自由间隙 46.2
                             #             ｜ 接触点轮心 49.7 ≈ 50 ✓
                             #   ⚠ 原来的 154 是拿"上座面高出筒口 35"倒推的，而那个 35
                             #     没有出处 —— 它使缓冲块在轮心才 9.9 就撞上（早了 37.3）。
                             #     详算与备选方案见 83_上弹簧座.toml 文件尾。

# ─────── 下支架（U 形夹持座，接转向节）───────
"耳板厚" = 8.0               # mm  两耳板
"耳板孔径" = 13.0            # mm  2 × φ13
                             #   ★  由 φ15 改 φ13 —— 按丰田官方：
                             #     减振器夹持螺栓为 **M12×1.25**（力矩 153 N·m），
                             #     φ13 = M12 通孔（中等间隙）。用户已在 SW 里改好。
"耳板孔距" = 35.0            # mm  两孔中心距
                             #   ★  由 90 改为 35 —— 用户在 SolidWorks 里改的，
                             #     以 03_模型/减振器壳_参数.txt 为准。
                             #     原 90 与「夹口宽 30」的矛盾由此消解（待问老师清单第 2 条可划掉）。
"夹口宽" = 30.0              # mm  夹口净宽，适配转向节
"夹口深" = 70.0              # mm  夹口深度（转向节凸耳插入深度）
                             #   ⚠ 支架在筒体上的【轴向位置】计算书未定，
                             #     待装配图/转向节接口确定后再补，暂不影响轮廓建模

# ★ 以下为【推荐值】（计算书未给，按常用边距规则 e ≥ 1.5d 推算）
"耳板宽" = 60.0              # mm  孔 φ15 居中时边距 = (60 − 15) / 2 = 22.5 = 1.5d ✓
"螺栓孔至开口端" = 35.0       # mm  孔心距耳板开口端 = 夹口深 70 的中点（螺栓穿凸耳中心，受力对称）
"支架连接板厚" = 10.0         # mm  U 形夹把两耳板连到筒体上的那块板
                             #   位置在【筒体下段外壁】（不在壳体顶部！），与底盖不是一回事：
                             #     底盖 = 筒体最下端的封板（属壳体，07 节明文）
                             #     本项 = 下支架的顶部横板（属支架，计算书未提，推荐值）

# ─────── 上口（装导向器与油封）───────
"上口内孔" = 38.0            # mm   ⚠ 几何疑点，见下方注释
"上口孔深" = "= 筒体长 / 2"   # mm   用户改为按筒体长折半（340 → 170）
"口部外倒角" = 2.0           # mm  倒【外圆 φ46 端部】（07 节原文："口部外缘倒角"，2×45°）
"口部内倒角" = 1.0           # mm  倒【内孔 φ38 入口】——建议值，便于压入导向器与油封组件
                             #   ★ 两个倒角位置不同：外倒角在外圆端部，内倒角在内孔入口，别搞反
                             # ⚠ 疑点（上口内孔 38）：此值 38 < 筒体内腔 42，而"车削"只能扩大孔径、
                             #   做不出更小的孔，所以"在内腔 φ42 里车出一个 φ38 的上口孔"物理上不成立。
                             #   两种可能：
                             #     (a) 筒体上端 55 段是【加厚壁】（壁厚 4 而非 2）→ 内孔 38 成立；
                             #     (b) 38 其实是【导向器/油封总成的外径】，筒体上口仍是 φ42、只需倒角。
                             #   两者建模结果不同，照抄自计算书 07 节，建模前请确认。

# ─────── 加强筋（弹簧盘 ↔ 筒体之间，沿径向均布）───────
"筋长" = 20.0                # mm  沿筒体径向的长度
"筋宽" = 10.0                # mm  筋的宽度
"筋数目" = 4                 # 条  沿圆周均布
                             #   ⚠ 计算书 07 节未提及加强筋，按需求补充；
                             #     具体布置（贴弹簧盘背面 / 贴筒体外壁）由建模时定

# ─────── 派生 ───────
"筒体内径" = "= 筒体外径 - 2 * 筒体壁厚"
"筒体总高" = "= 筒体长 + 底盖厚"
"弹簧盘至筒口" = "= 筒体长 - 弹簧盘位置"
"上口壁厚" = "= (筒体外径 - 上口内孔) / 2"

["材料"]
"筒体材料" = "45号优质碳素结构钢 精密钢管"    # GB/T 699，冷拔精密无缝管
"板件材料" = "Q345B低合金高强度结构钢 钢板"      # 底盖 / 弹簧盘 / 下支架
"筒体抗拉强度" = 600.0         # MPa  45号优质碳素结构钢 正火下限
"筒体屈服强度" = 355.0         # MPa
"板件屈服强度" = 345.0         # MPa
"弹性模量" = 206000.0          # MPa
"密度" = 7.85e-6              # kg/mm³
"表面处理" = "电泳涂装（内外防腐）"

["工况"]
"弹簧静载" = 4963.0            # N  弹簧传给弹簧盘的满载静载（第 3 节）
"弹簧最大载荷" = 6500.0         # N  极限工况
"筒内最大压力" = 2.5            # MPa 第 4 节

["校核"]
# 筒壁内压：薄壁圆筒 σ = pD/(2t)，D 取内径
"筒壁应力" = "= 筒内最大压力 * 筒体内径 / (2 * 筒体壁厚)"
"筒壁安全系数" = "= 筒体屈服强度 / 筒壁应力"
# 弹簧盘双面角焊缝受剪：有效厚度 = 0.7 × 焊脚
"弹簧盘焊脚" = 4.0              # mm  双面角焊缝
"焊缝周长" = "= 3.14159265 * 筒体外径"
"焊缝受剪面积" = "= 2 * 焊缝周长 * 0.7 * 弹簧盘焊脚"
"焊缝剪应力" = "= 弹簧静载 / 焊缝受剪面积"
# 下支架耳板：2 螺栓（丰田官方：M12×1.25，力矩 153 N·m）
"螺栓规格" = "M12x1.25"
"螺栓拧紧力矩" = 153.0          # N·m  ★  按官方由 150 改 153，规格由 M14 改 M12
