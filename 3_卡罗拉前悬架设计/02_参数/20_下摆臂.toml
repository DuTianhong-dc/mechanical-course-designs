# ================================================================
# 下摆臂 · 参数文件（公式驱动版）★ 本文件 = 唯一参数源
#
# 来源：设计计算书第 6 节 ＋ 用户  给定的硬点与分段截面定义
# 修订： 建表 ｜  按实际件核定三条接口尺寸（见下）
#
# ★ 范围：本表只含【下摆臂本体】。内端衬套总成、外端球头总成是独立零件，
#   本表只保留与它们配合的接口尺寸。
#
# ★ 坐标系（标准车辆坐标系，左前悬架；以球铰点 P1 为原点）：
#       X 车辆纵向，向前为正 ｜ Y 车辆横向，向左（车轮外侧）为正 ｜ Z 竖直向上为正
#   P1 = 球铰点；P2/P3 = 两个内铰点（后 / 前）；M = P2P3 连线中点
#
# ★ 分段截面（沿长度三段，各自独立——不是等截面）：
#   外端球头段(P1 附近) 高60×宽50   B/H=0.83  弯矩最大 → 优先抗弯，高而窄
#   中间主体段          高45×宽42   B/H=0.93  抗弯抗扭均衡、减重优先
#   内端衬套段(P2/P3 附近) 高50×宽55 B/H=1.10  侧向力集中 → 加宽提升抗扭与衬套空间
#
# ★ 最小参量原理：硬点坐标、各段内腔、两端接口尺寸，全部由独立参数解算，不赋值
#   （两端接口长度用"截面宽/高 + 附加量"表达，附加量是唯一外挂的常数）
#
# 规则：
#   ① 「独立参数」= 直接填数字 ｜ ② 「派生参数」= 填 "= 表达式"
#   ③ 数学函数用 SW 写法（sin/cos/tan/atn 一律按【度】）
#   ④ 单位：长度 mm｜力 N｜应力 MPa｜角度 °
#
# 导出到 SolidWorks：跑 04_脚本/导出方程式.py 20_下摆臂.toml → 03_模型/下摆臂_参数.txt
#   ★ 必须带文件名 —— 脚本已不提供「全量导出」（会误覆盖其它零件的 txt）
#   ⚠️ SW 里 下摆臂.SLDPRT 已链接该 txt：在 SW 里保存模型时 SW 会把内部方程表【导出覆盖】它，
#      注释会丢——这是 SW 的正常机制，被覆盖了重跑导出即可。
# ================================================================

["几何"]
# ═══════════ 独立参数（设计输入）═══════════

# ─────── 硬点定义 ───────
# 由 内铰点间距 + 两向倾角 + 有效摆长 解算，下游结果见下面几个派生量
"内铰点间距" = 269.0          # mm  两个衬管中心的直线距离 L
"纵向倾角" = 5.0              # °   轴线在 X-Z 竖直面投影与 X 轴夹角（前高后低为正）
"横向倾角" = 4.0              # °   轴线在 X-Y 水平面投影与 X 轴夹角（前内后外为正）
"球头高低差" = -7.0           # mm  球头 P1 相对轴线中点 M 的 Z 差（球头比中点低 7）
"有效摆长" = 320.0            # mm  球铰点 P1 到摆动轴线的垂直距离

# ─────── 分段截面（三段，沿长度渐变）───────
"外端截面高" = 60.0           # mm  球头安装段（P1 附近）：弯矩最大 → 优先抗弯
"外端截面宽" = 50.0           # mm
"中间截面高" = 45.0           # mm  主体段：抗弯抗扭均衡、减重优先
"中间截面宽" = 42.0           # mm
"内端截面高" = 50.0           # mm  衬套安装段（P2/P3 附近）：侧向力集中 → 加宽抗扭
"内端截面宽" = 55.0           # mm
"板厚" = 3.0                  # mm  两片冲压板厚度（各段共用）

# ─────── 两端接口 ───────
"内衬管内孔" = 32.0           # mm  = 衬套总成外径（过盈配合）
"球头座内孔" = 45.0           # mm  = 球头总成球壳外径（定位）
"球头固定螺栓直径" = 10.0     # mm  M10
"球头固定螺栓数" = 3          # 个  沿法兰均布

# ═══════════ 派生参数（解算，不赋值）═══════════

# ─────── 摆动轴线方向（单位向量，从后指向前）───────
"轴线k" = "= 1 / (1 + tan(纵向倾角) ** 2 + tan(横向倾角) ** 2) ** 0.5"
"轴线dx" = "= 轴线k"
"轴线dy" = "= 0 - 轴线k * tan(横向倾角)"
"轴线dz" = "= 轴线k * tan(纵向倾角)"

# ─────── 轴线中点 M（以 P1 为原点）───────
#   三个条件：|P1M| = 有效摆长、P1M ⊥ 轴线、M_z = -球头高低差
#
#   ⚠️ 命名避让：SW 的方程式变量名【大小写不敏感】，且同名时后写的顶掉先写的。
#      所以这里绝不能出现「中点a / 中点A」这种只差大小写的名字
#      （ 实测：这会让 8 条参数被静默丢光）。故一律用语义名。
"中点z" = "= 0 - 球头高低差"
#   过 M 且垂直于轴线的直线，写成 z = 中点z + 中点斜率z·x 、 y = 中点斜率y·x
"中点斜率z" = "= 0 - 中点z * 轴线dz / 轴线dx"
"中点斜率y" = "= 0 - 轴线dy / 轴线dx"
#   与球面 |P1M| = 有效摆长 联立 → 中点二次项·y² + 中点一次项·y + 中点常数项 = 0
"中点二次项" = "= 中点斜率y ** 2 + 1"
"中点一次项" = "= 2 * 中点斜率z * 中点斜率y"
"中点常数项" = "= 中点斜率z ** 2 + 中点z ** 2 - 有效摆长 ** 2"
"中点y" = "= (0 - 中点一次项 - (中点一次项 ** 2 - 4 * 中点二次项 * 中点常数项) ** 0.5) / (2 * 中点二次项)"
"中点x" = "= 中点斜率z + 中点斜率y * 中点y"

# ─────── 三个硬点坐标（以 P1 为原点，P1 即 (0,0,0)）───────
"半间距" = "= 内铰点间距 / 2"
"铰点后x" = "= 中点x - 半间距 * 轴线dx"
"铰点后y" = "= 中点y - 半间距 * 轴线dy"
"铰点后z" = "= 中点z - 半间距 * 轴线dz"
"铰点前x" = "= 中点x + 半间距 * 轴线dx"
"铰点前y" = "= 中点y + 半间距 * 轴线dy"
"铰点前z" = "= 中点z + 半间距 * 轴线dz"

# ─────── 各段内腔（两片 U 形对扣：左右侧壁各 2 层 → 内宽扣 4 层；
#                       顶壁、底壁各 1 层 → 内高扣 2 层）───────
"外端内宽" = "= 外端截面宽 - 4 * 板厚"
"外端内高" = "= 外端截面高 - 2 * 板厚"
"中间内宽" = "= 中间截面宽 - 4 * 板厚"
"中间内高" = "= 中间截面高 - 2 * 板厚"
"内端内宽" = "= 内端截面宽 - 4 * 板厚"
"内端内高" = "= 内端截面高 - 2 * 板厚"

# ─────── 各段宽高比（设计校核用，目标值见文件头）───────
"外端宽高比" = "= 外端截面宽 / 外端截面高"
"中间宽高比" = "= 中间截面宽 / 中间截面高"
"内端宽高比" = "= 内端截面宽 / 内端截面高"

# ─────── 两端接口 ───────
#   内端衬管：沿纵向贯穿【内端段】箱形。外径 = 内端段高；
#   长度 = 内端段宽 + 附加量（附加量是实际件比设计截面多出的部分）
"内衬管外径" = "= 内端截面高"
"内衬管长" = "= 内端截面宽 + 10"      # → 65  实际件比内端截面宽（55）多 10
#   外端球头座：沿竖直贯穿【外端段】箱形。外径 = 外端段宽；
#   长度 = 外端段高 + 附加量
"球头座外径" = "= 外端截面宽"
"球头座长" = "= 外端截面高 + 3"       # → 63  实际件比外端截面高（60）多 3

# ─────── 截面圆角 ───────
#   ★  新增：用户在 SolidWorks 建模时加的，以 03_模型/下摆臂_参数.txt 为准。
#     位于 txt 末行；本表按同序放在几何区末尾。
"截面圆角" = 12.0            # mm  箱形截面（U 形对扣）的过渡圆角半径

["材料"]
"摆臂本体" = "QStE420热机械轧制高强钢 / SPFH590"   # 汽车结构用高强冲压钢板
"摆臂_屈服" = 420.0                # MPa
"摆臂_抗拉" = 500.0                # MPa
"衬管与球头座" = "20号优质碳素结构钢 无缝钢管"     # 焊接在摆臂上，取可焊性好的低碳钢
"弹性模量" = 206000.0              # MPa
"泊松比" = 0.3
"密度" = 7.85e-6                   # kg/mm³

["工况"]
# 最恶劣工况：侧向（转弯），轮胎侧向力经转向节传至球头
"侧向力" = 3500.0            # N  F = μ·F_z·k_d·λ = 0.8 × 5204 × 1.4 × 0.6
"附着系数" = 0.8
"动载系数" = 1.4
"摆臂分担系数" = 0.6

["校核"]
# 力学模型：悬臂梁（球头端受侧向力，内端铰接固定），力臂取【有效摆长】320
"弯矩" = "= 侧向力 * 有效摆长 / 1000"
# 最薄弱截面取【中间主体段】（截面最小而弯矩仍大）
"抗弯截面系数" = "= (中间截面宽 * 中间截面高 ** 3 - 中间内宽 * 中间内高 ** 3) / (6 * 中间截面高)"
"弯曲应力" = "= 弯矩 * 1000 / 抗弯截面系数"
"安全系数" = "= 摆臂_屈服 / 弯曲应力"
