# ================================================================
# 全局参数（跨零件共享）
#
# 用途：存放所有零件都要用、或需要保持一致的参数。
#       零件私有参数请放在各自的文件里（10_/20_/30_…），
#       不要往这里塞单个零件专有的尺寸，避免"参数串台"。
#
# 用法（Python 3.11+）：
#   import tomllib
#   G = tomllib.load(open("02_参数/00_全局.toml", "rb"))
#   材料牌号 = G["材料"]["弹簧钢"]
#
# ★ TOML 注意：中文 key 必须加引号（裸 key 只允许 A-Za-z0-9_-）
# ★ 单一来源约定：参数以本文件 + 零件文件为准；
#   01_设计计算/*.md 里的数值是"推导过程"，改动请先改本目录的参数文件。
# ================================================================

# ---------------------------------------------------------------
# 材料库（各零件的选材与力学性能）
# ---------------------------------------------------------------
["材料"]
"弹簧钢" = "60Si2MnA弹簧钢"        # 螺旋弹簧 GB/T 1222
"弹簧钢_G" = 79000.0          # MPa  弹性模量
"弹簧钢_σb" = 1650.0          # MPa  抗拉强度下限
"摆臂钢" = "QStE420热机械轧制高强钢"          # 下摆臂 冲压高强钢
"摆臂钢_σs" = 420.0           # MPa  屈服强度
"筒体钢" = "45号优质碳素结构钢"               # 减振器壳 精密钢管
"筒体钢_σb" = 355.0            # MPa  45号钢抗拉强度

# ---------------------------------------------------------------
# 整车工况（所有零件的载荷来源）
# ---------------------------------------------------------------
["工况"]
"整备质量_kg" = 1155.0        # kg   整车整备质量
"满载质量_kg" = 1770.0        # kg   满载总质量
"轴距_mm" = 2700.0            # mm   轴距
"轮距_mm" = 1527.0            # mm   前轮距
"车轮滚动半径_mm" = 317.0      # mm   195/65 R15
"前轴荷分配" = 0.60           # 满载时前轴承担比例
"设计工况" = "满载 + 侧向转弯"

# ---------------------------------------------------------------
# 设计规范
# ---------------------------------------------------------------
["规范"]
"侧倾中心高度目标_mm" = 35.0   # 常规 0~100，越低越抗侧倾
"主销内倾角范围_deg" = "12~15"
"主销后倾角范围_deg" = "2~6"
"弹簧端面处理" = "两端并紧磨平"   # 磨平部分 ≥3/4 圈，端头厚 ≈0.25d

# ---------------------------------------------------------------
# ★★ 实车定位参数 —— 卡罗拉 E210（TNGA）官方维修手册标准值
#    来源：用户  提供 ｜ 状态：**空载整备、标准胎压**下测量
#    用途：校核第 4.3 节主销倾角、第 5 节硬点布置
# ---------------------------------------------------------------
["定位"]
"车轮外倾角_deg" = -0.58       # −0°35′  公差 ±45′；可通过减振器偏心螺栓调整
"主销后倾角_deg" = 3.17        # +3°10′  公差 ±45′；**不可调**
"主销内倾角_deg" = 12.58       # +12°35′ 公差 ±45′；**不可调**，由转向节与减振器安装角决定
"总前束_deg" = 0.0             # 0° ±12′
"总前束_mm" = 0.0              # 0 ±2 mm
"最大转向角_内_deg" = 40.58    # 40°35′ ±2°
"最大转向角_外_deg" = 34.25    # 34°15′
"定位公差_deg" = 0.75          # ±45′（外倾/后倾/内倾 通用）
"左右差上限_deg" = 0.75        # ±45′

# ★ 偏心螺栓（调外倾角）：装在减振器与转向节的夹持螺栓处
"外倾偏心单档_deg" = 0.25      # 按偏心螺栓标记分档
"外倾调整范围_deg" = 1.5       # ±1.5°

# ★ 转向节接口（详见 70_转向节.toml）
"下球头锥度比" = 10.0          # 1:10（官方）；锁紧螺母 90 N·m
"减振器夹持螺栓" = "M12x1.25"  # 官方；力矩 153 N·m
"转向拉杆球头力矩_Nm" = 74.0
"轮毂螺栓数" = 3               # ★  更正：官方手册为 3 个（原按资料写 4）
"轮毂螺栓分布圆_mm" = 110.0    # ⚠️ 估算值（原 100 与"4 螺栓"同源、未验证；待实测）
