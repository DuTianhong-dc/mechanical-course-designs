# ================================================================
# 标准件 · 参数文件 ★ 本文件 = 唯一参数源
#
# 用途：存放【查国标表得到】、不参与设计计算的紧固件尺寸。
#       这些值不是"设计出来的"，是"选出来的"，所以不写进零件表 ——
#       否则一根活塞杆的参数表里塞着螺母的厚度，看着就不像"一根杆"。
#
# 引用方式：零件表里直接写名字即可（求值器会自动注入本表）。
#   例：81_活塞杆.toml 的「螺纹段长」= 顶胶高 + 防松垫片厚 + M14螺母厚
#
# ★ 本表【不导出】——没有几何体，只给 04_脚本/params.py 求值用。
#   要把这些尺寸带进 SW，由引用它的零件表负责导出。
#
# 建立：（从原 81_活塞.toml 拆出）
# ================================================================

