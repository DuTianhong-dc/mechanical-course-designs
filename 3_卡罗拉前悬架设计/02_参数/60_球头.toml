# ================================================================
# 球头（球头销） · 参数文件 ★ 本文件 = 唯一参数源
#
# 属【球头总成】的球销件（与 50_球头总成.toml 的球壳/球座配套）
# 建立： ｜ ★  用户更新（锥面 50→55、螺纹 20→25、加销孔）
#
# ★★ 本区【按依赖顺序排列】—— 独立量在前、派生量紧随其后。
#     SW 链接外部 txt 时按文件顺序求解，若某条引用了"排在它后面"的变量会报警告。
#     （ 教训：锥度比 曾写成 引用后置的锥面长度/小端直径 → SW 报警告；
#       现已排到其输入之后。）
#
# ★ 球销的轴向组成（自下而上）：
#     球头 φ25 → 锥面（大端 φ20 → 小端 φ15，长 55）→ 螺纹 M14×1.5（长 25，带销孔）
#   ⚠️ 锥面小端 = 杆部直径 = φ15（用户  定：锥面一直收到杆部直径）
#   ⚠️ 锥度比 = 锥面长度 /（大端 − 小端）= 55/5 = 11 → 与转向节锥孔 1:11 配对 ✓
#
# ★ 接口：
#     锥面大端/小端/锥度比  ←→  70_转向节.toml 的「球头锥孔」
#     杆部直径            ←→  50_球头总成.toml（⚠️ 该表仍写 14，见文件尾）
#     壳体总高            ←→  50_球头总成.toml（= 50）
#
# 规则：① 独立=填数字 ② 派生=填 "= 表达式" ③ 幂用 **（导出时自动转 ^）
#       ④ 单位 mm ｜ ⑤ 中文 key 与表达式都要加引号
# 导出：04_脚本/导出方程式.py 60_球头.toml → 03_模型/球头_参数.txt
# ================================================================

["几何"]
# ─────── 球面 / 锥面 / 杆部 ───────
"球头直径" = 25.0            # mm  ★ 球面 φ25（球座内球面按此取值）
"杆部直径" = 15.0            # mm  ★  用户由 14 改 15
"锥面大端直径" = 20.0        # mm
"锥面长度" = 55.0            # mm  ★  用户由 50 改 55
                             #   （= 按 1:11 从 φ20 收到 φ15 所需的轴向长度：(20−15)×11 = 55）
"锥面小端直径" = "= 杆部直径"  # → 15（锥面小端即杆部直径）

# ─────── 螺纹 ───────
"螺纹公称直径" = 14.0        # mm  M14
"螺纹螺距" = 1.5             # mm  ×1.5（细牙）
"螺纹长度" = 25.0            # mm  ★  用户由 20 改 25
                             #   配开槽螺母 GB/T 9457 M14×1.5（高 17.8）✓ 余量够

# ─────── 轴向（相对减振器壳，装配基准）───────
"壳体总高" = 50.0            # mm  ★ 接口：= 50_球头总成.toml 的「壳体总高」
"球心距壳体底面" = 27.0       # mm
"杆部伸出长度" = "= 螺纹长度"  # → 25（ 用户改为挂到螺纹长度）

# ─────── 派生 ───────
"球面半径" = "= 球头直径 / 2"                                  # → 12.5
"球心至壳体上端面" = "= 壳体总高 - 球心距壳体底面"               # → 23（球壳侧的参考量）
"球心至螺纹末端" = "= 球面半径 + 锥面长度 + 螺纹长度"            # → 92.5
                             #   ★  改（用户定："改其中一个即可"）：
                             #     原式 = 壳体总高 − 球心距壳体底面 + 杆部伸出长度 = 48，
                             #     但那条链与球销的**实际几何对不上**（差 44.5）：
                             #         球心 → 球面 12.5 → 锥面 55 → 螺纹 25 = **92.5**
                             #     现改为按球销自身几何计算。
                             #   ⚠️ 未动三个上游参数的原因：
                             #     ·「杆部伸出长度」已绑球销几何（D5@草图2）—— 改它会改模型
                             #     ·「壳体总高」绑球头总成几何（D3@草图1）+ 与 50 表配对
                             #     ·「球心距壳体底面」改则算成 −17.5（不成立）
                             #     本条【未绑任何几何】（SW 方程表里无 D@ 引用它），改动安全
"锥度比" = "= 锥面长度 / (锥面大端直径 - 锥面小端直径)"           # → 11
                             #   ★ 放在这里（其输入都已在前面）—— 避免 SW 报"引用在前"

# ─────── 开口销孔（配开槽螺母的防松）───────
"销孔直径" = 3.5             # mm  ★  用户定 = φ3.5
                             #   配开口销 φ3.2（SW 库给开槽螺母 M14×1.5 的推荐值）
"销孔离端面距离" = 13.0       # mm  ★  用户定
                             #   ⚠️ 需明确"端面"指哪个：螺纹末端 / 锥面起点
                             #     按开槽螺母（高 17.8、槽位 12.8~17.8 自螺母支承面）核对，
                             #     孔位应落在槽的轴向区间内，否则销子穿不过去

["材料"]
"球头材料" = "40Cr合金结构钢"   # GB/T 3077；SW 自定义材质库同名
                              #   调质 + 高频淬火（表面 HRC58~62 / 心部 HRC30~38）

["_校验"]
"接口_球头直径=25" = "= 球头直径 == 25.0"
"接口_杆部直径=15" = "= 杆部直径 == 15.0"
"锥度比=11" = "= 锥度比 == 11.0"
"锥面小端=杆部" = "= 锥面小端直径 == 杆部直径"
"锥面方向正确" = "= 锥面大端直径 > 杆部直径"
"接口_壳体总高=50" = "= 壳体总高 == 50.0"
"球心在壳体内" = "= 球心距壳体底面 < 壳体总高"
"杆部伸出壳体" = "= 杆部伸出长度 > 0"
# ★ 锥面必须长于转向节锥孔深，否则接触不足
"锥面长于锥孔" = "= 锥面长度 >= 30.0"
# ★ 轴向链守卫：球销总长须容得下「球面+锥面+螺纹」（防止上游再改出矛盾）
"轴向链闭合" = "= 球心至螺纹末端 >= 球面半径 + 锥面长度 + 螺纹长度"


