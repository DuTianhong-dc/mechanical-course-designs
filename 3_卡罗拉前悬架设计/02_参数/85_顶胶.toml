# ================================================================
# 顶胶（上支座 / Strut Mount） · 参数文件 ★ 本文件 = 唯一参数源
#
# 属【支柱上部】五件之一（用户  定）
# 建立：
#
# ★ 装在哪、干什么：
#   麦弗逊支柱的【上支点】——上端经它连车身塔顶，下端坐上弹簧座。
#   三重职责：① 把悬挂载荷传给车身 ② 隔振 ③ 配合平面推力轴承允许转向。
#
# ★★ 组成（ 调研，来源见下方"尺寸出处"）：
#     ① 上部金属法兰盘 —— 连车身，带安装螺栓
#     ② 中部橡胶弹性体 —— 隔振主体，耐 −40~+120 ℃
#     ③ 下部金属座 / 内套管 —— 套在活塞杆上，传减振器力
#     ④ 下端面止口 —— 承接平面推力轴承的上垫圈（AS 4060）
#   注：平面推力轴承本身是【独立零件】→ 84_平面推力轴承.toml，不在本表。
#
# ★★ 尺寸出处：卡罗拉 E210（本设计原型）前顶胶【商品件实测参数】
#     RIDEX 1180S0444 / 1180S0234（前轴，标注 without ball bearing）：
#         Inner Diameter 15 mm  ｜ Outer Diameter 83~85 mm  ｜ Overall Height 41 mm
#     → **内径 15 与我们的活塞杆 φ15 完全吻合**（印证第 6 节的杆径选择）
#     ⚠️ **高取 41**，而不是本表早先暂定的 30 —— 30 是当初拍的，41 有出处。
#        但这会把活塞杆总长顶上去：杆端 424 → 435，杆长 307 → 318（见文件尾）。
#
# ★ 取值口径：只给【基本尺寸】；配合、公差、粗糙度留到标注阶段。
#
# 规则：① 独立=填数字 ② 派生=填 "= 表达式" ③ 幂用 **（导出时自动转 ^）
#       ④ 单位 mm ｜ ⑤ 中文 key 与表达式都要加引号
# 导出：04_脚本/导出方程式.py 85_顶胶.toml → 03_模型/顶胶_参数.txt
# ================================================================

["几何"]
# ★★ ：本节【以 03_模型/顶胶_参数.txt 为准】—— 照用户在 SW 里手写的那一版录入
"活塞杆直径" = 15.0          # mm  ★ 接口 = 81_活塞杆.toml
"间隙" = 0.5                 # mm  与活塞杆的单边配合间隙
"顶胶中心孔" = "= 活塞杆直径 + 2 * 间隙"      # → 16

# ─────── 外形 ───────
"顶胶外径" = 150.0           # mm  （用户由 85 改为 150 —— 比上弹簧座 φ135 大）
"顶胶高" = 41.0              # mm  ★ 出处：卡罗拉商品件 Overall Height 41

# ─────── 径向分层（含义待与用户确认）───────
"内层壁厚" = 2.0             # mm  内套管（贴活塞杆那层金属）
"外层壁厚" = 6.0             # mm  外圈金属
"法兰高" = 20.0              # mm  上法兰盘的轴向高度

# ─────── 与车身塔顶的连接螺孔 ───────
# ⚠ 这是【顶胶连车身】的孔，不是活塞杆那套螺母垫片 —— 两者别混
"连接螺栓孔" = 11.0          # mm  （ 用户由 14 改为 11 → 对应 **M10** 螺栓）
                             #   与卡罗拉实物一致（调研见 GH-364576：External Thread M10×1.25）
"螺栓距边缘" = 12.0          # mm  孔心到顶胶外缘的距离
                             #   ⚠ 净边距 = 12 − 5.5 = 6.5，对 M10（要求 ≥15）仍偏薄 —— 见文件尾

# ─────── 下端面止口（承接平面推力轴承 AXK 4060）───────
"下端面止口内径" = 60.0      # mm  ★ 接口 = AXK 4060 外径 φ60
"下端面止口外径" = 64.0      # mm
"下端面止口深" = 1.0         # mm

["材料"]
# ★ 三处材料 **SW 自定义材质库里都有**（ 核对，2023 / 2026 两个库各 11 种）
"法兰材料" = "10号优质碳素结构钢"      # 上法兰盘 + 金属骨架。冲压件，选材按深冲冷轧板
                                       #   （SPCC / 08F 级低碳钢）→ 库里 10 号钢最贴近
"内套管材料" = "20号优质碳素结构钢"    # 下部金属座 / 内套管：套活塞杆、传减振器力，载荷高于法兰
"橡胶材料" = "天然橡胶（NR60）"        # 弹性体。库里这条即 NR 邵氏 60±5 A，
                                       #   正好落在顶胶常用的 55~65 A 档位 ✓
"骨架厚度" = 3.0                       # mm  调研：金属骨架通常 2~3
"表面处理" = "金属件磷化 / 电泳防锈"    # 调研：骨架需做防锈处理

["_校验"]
"中心孔配杆" = "= 顶胶中心孔 > 活塞杆直径"
"顶胶高为正" = "= 顶胶高 > 0"
"止口配轴承" = "= 下端面止口内径 >= 60.0"          # 60 = AXK 4060 外径
"止口外径大于内径" = "= 下端面止口外径 > 下端面止口内径"
"止口深为正" = "= 下端面止口深 > 0"
# ⚠ 原「顶胶小于上座」= 顶胶外径 < 135.0 已删
#    用户把顶胶外径改到 150（> 上座 φ135），该判据不再成立。
#    结构上没问题：顶胶连车身塔顶，本来就可能比弹簧座大。


