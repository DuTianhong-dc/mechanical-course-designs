# ================================================================
# 转向节 · 参数文件（公式驱动版）★ 本文件 = 唯一参数源
#
# 来源：与下摆臂球头、减振器壳下支架、轮毂单元、制动钳的配合关系
#      ＋ 丰田官方接口数据（）｜ 建立：
# ★  用户重写并完工（几何 22 条 → 40 条，新增轴承座/卡钳/凸台整套）
#
# ★ 性质：转向节是【配合件】——不是本次课设的交付零件（交付只有前悬架装配图、
#   减振器壳零件图、下摆臂零件图、说明书）。它进装配图是为了讲清四类连接：
#     ① 下摆臂球头销 → 插进它的锥孔
#     ② 减振器壳下支架 U 形夹口 → 夹住它的凸耳
#     ③ 转向拉杆外球头 → 插进另一个同规格锥孔（用户定：与①按通用件）
#     ④ 轮毂轴承单元 + 制动钳 → 装在它的轴承座与卡钳座上
#
# ★ 实车接口（官方数据，权威）：
#   ① 下摆臂球头 —— 锥形销孔；② 减振器 —— 双螺栓 M12×1.25、153 N·m、
#   配偏心螺栓调外倾（单档 0.25°、总 ±1.5°）；③ 转向拉杆 —— 外球头螺母 74 N·m；
#   ④ 轮毂轴承 —— 3 螺栓（官方维修手册"3 bolts"，力矩 130 N·m）
#
# ★★ 取值与排序口径（）：
#   · 参数名、数值【一律以用户 SW 模型里的 txt 为准】
#   · 本区【按依赖顺序排列】—— 独立量在前、派生量紧随其后。
#     SW 链接外部 txt 时按文件顺序求解，引用"排在后面"的变量会报警告。
#     故 球头锥孔大端 / 拉杆球头锥孔大端 / 夹持凸台厚度 三条派生量
#     必须排在其输入（小端、深、锥度比、总厚度、凸耳厚）之后。
#
# 规则：① 独立=填数字 ② 派生=填 "= 表达式" ③ 幂用 **（导出时自动转 ^）
#       ④ 单位 mm ｜ ⑤ 中文 key 与表达式都要加引号
# 导出：04_脚本/导出方程式.py 70_转向节.toml → 03_模型/转向节_参数.txt
# ================================================================

["几何"]
# ─────── ① 下摆臂球头锥孔 ───────
"球头锥孔小端" = 15.0        # mm  ★ 接口 = 60_球头.toml「锥面小端直径」（= 杆部直径 15）
                             #   ⚠️ 注意方向：锥孔【小端在上】（螺母侧），大端在下
"球头锥孔锥度比" = 11.0      # —   ★ 接口 = 60_球头.toml「锥度比」（ 由 10 改 11）
"球头锥孔深" = 30.0          # mm  配研长度

# ─────── ② 减振器夹持凸耳 ───────
"夹持凸耳厚" = 20.0          # mm  凸耳主板厚度（ 由 30 改 20）
"夹持螺栓孔径" = 13.0        # mm  2 × φ13（配 M12×1.25 偏心螺栓，官方）
"夹持螺栓孔距" = 35.0        # mm  ★ 接口 = 30_减振器壳.toml「耳板孔距」

# ─────── ③ 转向拉杆外球头锥孔（与①同源）───────
#   ★★ 用户定：横拉杆球铰与下摆臂球铰按【通用件】计算 → 三个尺寸全挂到①
"拉杆球头锥孔小端" = "= 球头锥孔小端"          # → 15
"拉杆球头锥孔锥度比" = "= 球头锥孔锥度比"      # → 11
"拉杆球头锥孔深" = "= 球头锥孔深"              # → 30

# ─────── ④ 主销轴线 ───────
"主销偏移距离轴承中心" = 18.8  # mm  主销轴线在 XZ 投影内、距轴承座中心的垂直距离
                               #   （ 由 18.5 微调为 18.8）

# ─────── ⑤ 派生（必须排在其输入之后，否则 SW 报"引用在前"警告）───────
"球头锥孔大端" = "= 球头锥孔小端 + 球头锥孔深 / 球头锥孔锥度比"            # → 17.73
"拉杆球头锥孔大端" = "= 拉杆球头锥孔小端 + 拉杆球头锥孔深 / 拉杆球头锥孔锥度比"  # → 17.73

# ─────── ⑥ 轴承座（轮毂单元安装）───────
"轴承座公称内径" = 135.0     # mm  ⚠️ 待核对：配件资料（SKF VKBA 7811）给的是法兰 φ150、
                             #   单元定位外径约 φ85；φ135 更接近法兰外径 —— 请确认所指特征
"轴承座深度" = 64.0          # mm  与用户实测一致 ✓

# ─────── ⑦ 制动钳安装 ───────
"卡钳安装座孔径" = 12.0      # mm  2 孔，配 M12
"卡钳安装孔夹角" = 50.0      # °   两孔相对轴承中心的夹角
"卡钳安装圆周直径" = 300.0   # mm  两孔所在分布圆（配 φ275 制动盘，卡钳跨在盘外）
"卡钳角平分线与竖直夹角" = 90.0  # °  = 水平方向（卡钳位于盘的前/后方）

# ─────── ⑧ 铸件各凸台与壁厚 ───────
"螺栓凸台高度" = 4.0
"螺栓凸台壁厚" = 4.0
"螺栓凸台拔模斜度" = 3.0      # °
"基体高度" = 20.0
"轴承座壁厚" = 20.0

# ─────── ⑨ 主销角度（引自第 5 节）───────
"主销后倾角" = 3.17           # °  官方
"主销与铅垂线真实夹角" = 12.95  # °  三维真夹角（= 内倾与后倾的叠加）
"主销内倾角" = 12.58          # °  官方
"主销与轴承座中心垂直距离" = 80.0  # mm  轴承座中心到主销轴线的三维垂距
"球头锥孔最小壁厚" = 10.0     # mm  锥孔周圈最小壁厚（铸件强度）
"球铰与下支点距" = 250.0      # mm  ⚠️ 待确认「下支点」所指 —— 见文件尾提示

# ─────── ⑩ 夹持凸台 ───────
"夹持总厚度" = 29.5          # mm  ★ 应与 30_减振器壳.toml「夹口宽 30」配对（现差 0.5）
"夹持凸台厚度" = "= (夹持总厚度 - 夹持凸耳厚) / 2"     # → 4.75
"夹持凸台拔模" = 3.0          # °
"螺栓安装位置" = 30.0

# ─────── ⑪ 转向节臂 ───────
"横拉球铰与下摆臂球铰点夹角" = 90.0  # °  两个球铰点相对轴承中心的夹角

# ─────── ⑫ 轮毂连接座 ───────
"轮毂连接座螺栓分布外圆直径" = 160.0  # mm  ⚠️ 待核对（官方只给"3 螺栓、φ100"的旧说，
                                     #   后经配件/手册核对为 3 螺栓；本值 160 为用户模型值）
"轮毂螺栓孔径" = 13.0        # mm  3 × φ13（配 M12）
"轮毂螺栓凸台厚度" = 4.0
"轮毂螺栓凸台拔模" = 3.0      # °
"轮毂螺栓座壁厚" = 15.0
"轮毂螺栓凸台壁厚" = 4.0

["材料"]
"转向节材料" = "球墨铸铁（QT450-10）"   # ★ 汽车转向节的标准牌号（GB/T 1348-2009）
                                      #   σb > 450 ｜ σs > 310 MPa ｜ δ > 10% ｜ HB 160~210
                                      #   ★  已建入 SW 自定义材质库（新增「铸铁」分类）
                                      #     E=169 GPa ｜ ν=0.275 ｜ ρ=7100 kg/m³

["_校验"]
# ★ 与球头销的配对（两件必须同一锥度、同一小端）
"锥孔小端配球头销" = "= 球头锥孔小端 == 15.0"
"锥度配球头销1:11" = "= 球头锥孔锥度比 == 11.0"
"锥孔大端大于小端" = "= 球头锥孔大端 > 球头锥孔小端"
# ★ 两处球头锥孔必须完全一致（横拉杆与下摆臂共用同一套球铰部件）
"两锥孔小端一致" = "= 拉杆球头锥孔小端 == 球头锥孔小端"
"两锥孔锥度一致" = "= 拉杆球头锥孔锥度比 == 球头锥孔锥度比"
"两锥孔深度一致" = "= 拉杆球头锥孔深 == 球头锥孔深"
# 夹持
"夹持孔配M12" = "= 夹持螺栓孔径 >= 12.0"
"夹持凸台为正" = "= 夹持凸台厚度 > 0"


