# ================================================================
# 球头总成（整体式单壳球铰） · 参数文件（公式驱动版）★ 本文件 = 唯一参数源
#
# 来源：《整体式单壳下摆臂球铰尺寸方案》用户  给定
# 建立： ｜ 精简：
#
# ★★ 取值口径：本表只给【基本尺寸】，一律取整。配合、过盈、公差、粗糙度等
#    一律【留到二维标注阶段】处理，不进建模参数（见文末注释块）。
#
# ★ 范围：只含【球头总成】= 上下球座 + 壳体 + 防尘罩（配套件）。
#   **不含球销**（另立件），只取它两个接口：球头直径 φ25、杆部直径 φ14。用量 1 件/车角。
#
# ★ 结构：整体式冷挤压单壳 + 上下球座 + 端口滚铆收口。
#   壳体为【等径 φ45 管】：下部 φ45 段压入摆臂孔（压装段），上部端口滚铆翻边扣住上球座法兰。
#   内孔分三档：端口 φ41 台阶孔（容纳法兰）→ 主内孔 φ38（装球座）→ 底部 φ36 定位台阶。
#
# ★ 滚花按要求不考虑 —— 压装段按光圆柱建模。
#
# 规则：① 独立=填数字 ② 派生=填 "= 表达式" ③ 幂用 **（导出时自动转 ^）
#       ④ 单位 mm ｜ ⑤ 中文 key 与表达式都要加引号
# 导出：04_脚本/导出方程式.py 50_球头总成.toml → 03_模型/球头总成_参数.txt
# ================================================================

["几何"]
# ─────── 壳体 ───────
"壳体外径" = 45.0            # mm  等径管：下部为压装段，上部为收口端
"壳体总高" = 50.0            # mm
"壳体内孔" = 38.0            # mm  主内孔（装球座）
"收口端内孔" = 41.0          # mm  端口台阶孔，容纳上球座法兰 φ40
"底部封闭端厚" = 4.0         # mm
"定位台阶内径" = 36.0        # mm  限制下球座下沉
"定位台阶高" = 2.0           # mm
"压装段长" = 32.0            # mm  压入摆臂孔的深度（< 摆臂球头座长 63）
"收口翻边宽" = 3.0           # mm  滚铆后翻边轴向宽度

# ─────── 上下球座 ───────
"球头直径" = 25.0            # mm  ★ 接口：球销球面 φ25（球销另立件）
"球座外径" = 38.0            # mm  上下球座共用基本尺寸（装壳体内孔）
"上球座法兰外径" = 40.0      # mm  收口扣压用
"上球座法兰厚" = 2.0         # mm
"上球座高" = 12.0            # mm

# ─────── 防尘罩（配套件）───────
"防尘罩下卡径" = 44.0        # mm  箍壳体外壁沟槽
"防尘罩上卡径" = 16.0        # mm  箍球销杆部密封槽
"防尘罩自由高" = 28.0        # mm  带 2 道波纹

# ─────── 接口 / 派生 ───────
"球销杆部直径" = 14.0        # mm  ★ 接口：球销杆部（防尘罩上卡径按其取值）
                             #   ⚠️ ：60_球头.toml 的「杆部直径」= **15**，本表为 **14**
                             #      —— 用户已知此差异，定"**不统一**"（两点已按实际建模自行处理）
"收口端壁厚" = "= (壳体外径 - 收口端内孔) / 2"      # → 2.0

# ─────── 压装段限位台肩 / 球铰行程 ───────
"压装段法兰厚" = 2.0         # mm  压装限位台肩厚度（限制压入深度）
"压装段法兰外径" = "= 壳体外径 + 2"                # → 47
"单平面球铰行程" = 30.0      # ⚠️ 单位待确认（° 还是 mm）——用户  在模型中添加

# ─────── 球销锥面（接口，与 60_球头.toml 一致）───────
"锥面大端直径" = 20.0        # mm  ★ 接口 = 60_球头.toml「锥面大端直径」
"锥度比" = 11.0              # —   ★★  用户由 10 改 **11**（配 60_球头 / 70_转向节）
"锥度" = "= atn(1 / 锥度比)" # °   半锥角 → atn(1/11) = 5.19°

["材料"]
"壳体材料" = "10号优质碳素结构钢"   # GB/T 699，低碳可冷挤压成型；SW 材质库名「10号优质碳素结构钢」
"球座材料" = "25%玻纤增强聚甲醛（POM-GF25）"   # ISO 标识 >POM-GF25，GB/T 22271；SW 材质库同名
"防尘罩材料" = "EPDM"          # ⚠️ 库中暂无，可暂用「天然橡胶（NR60）」（硬度相近）

["_校验"]
# ★ 外扩的核心判据：上球座法兰必须能从收口端内孔通过
"法兰能通过端口" = "= 上球座法兰外径 < 收口端内孔"
# 滚铆翻边要够宽，才能盖住法兰与端口之间的环形间隙
"收口能扣住法兰" = "= (收口端内孔 - 上球座法兰外径) / 2 < 收口翻边宽"
# 球座基本尺寸不得大于主内孔（实际靠 H7/h6 过渡配合，见文末）
"球座能装入" = "= 球座外径 <= 壳体内孔"
"接口_球头直径=25" = "= 球头直径 == 25.0"
"接口_杆部直径=14" = "= 球销杆部直径 == 14.0"


# ================================================================
# 以下全部【留到二维标注阶段】—— 不是建模尺寸，不导出，仅留档
#
# ── 配合与公差（标注在图纸上，不进模型）──
#   压装段 ↔ 摆臂球头座孔：φ45H7 基孔制，过盈量 0.035~0.12（可用滚花/选配保证）
#   球座 ↔ 壳体内孔：φ38 H7/h6 过渡配合（方案实测下座 φ38.4、上座 φ38.3）
#   球头 ↔ 球座内球面：初始配合间隙 0.02~0.05，装配预压后呈微过盈
#   成品轴向窜动量 ≤ 0.15 ｜ 球心对壳体外圆同轴度 ≤ 0.05 ｜ 杆部对轴线同轴度 ≤ 0.10
#
# ── 压装工艺 ──
#   压装力 18~25 kN ｜ 压入速度 10~20 mm/s ｜ 压装后抗拔脱力 ≥ 18 kN
#
# ── 球头性能 ──
#   起动力矩 3~8 N·m ｜ 工作回转力矩 2~5 N·m
#   内注球节专用极压锂基脂 ≈8 g ｜ 防尘罩 EPDM 邵氏 60±5 A
#
# ── 材料（按方案原文）──
#   壳体：10号优质碳素结构钢，GB/T 699 —— 低碳、塑性好，才做得了冷挤压单壳
#   球座：25%玻纤增强聚甲醛（POM-GF25）（25% 玻纤增强聚甲醛），GB/T 22271；内球面复合 PTFE 自润滑薄层
#   防尘罩：EPDM 邵氏 60±5 A（库里暂无 EPDM）
#
