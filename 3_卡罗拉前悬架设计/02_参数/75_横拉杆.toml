# ================================================================
# 横拉杆（转向横拉杆） · 参数文件 ★ 本文件 = 唯一参数源
#
# 建立：
#
# ★ 装在哪、干什么：
#   麦弗逊前悬架的**转向传力件** —— 把转向机齿条的运动传到转向节，使车轮偏转。
#
# ★★ 结构（用户  定，简化：焊接钢管 + 压装球头）：
#
#        [球头座管] ──── 主体钢管（折一下）──── [球头座管]
#           ↑                                          ↑
#      压装球头总成                                压装球头总成
#      球销→转向节拉杆锥孔                        球销→转向机齿条端
#
#   · 两端球头座【与下摆臂外端同款】：φ50 外径 / φ45 内孔 / 长 63
#   · 压装【现成的球头总成】—— 即 50_球头总成.toml 那一件，两端各一个
#
# ★ 本件【不画图】，只建模看装配关系 —— 故参数取"能建出样子"的最简集：
#   总长直接给值，不再由球头中心距派生。
#
# ★ 接口（须与其它表一致）：
#     球头座内孔 ←→ 50_球头总成.toml「壳体外径」φ45（压装定位）
#     球头座外径/长度 ←→ 20_下摆臂.toml（同款 φ50 / 63）
#
# 规则：① 独立=填数字 ② 派生=填 "= 表达式" ③ 幂用 **（导出时自动转 ^）
#       ④ 单位 mm ｜ ⑤ 中文 key 与表达式都要加引号
# 导出：04_脚本/导出方程式.py 75_横拉杆.toml → 03_模型/横拉杆_参数.txt
# ================================================================

["几何"]
# ─────── 两端球头座（与下摆臂外端同款）───────
"球头座外径" = 50.0          # mm
"球头座内孔" = 45.0          # mm  压装 φ45 球头总成
"球头座长度" = 63.0          # mm

# ─────── 主体钢管 ───────
"主体管外径" = 32.0          # mm
"主体管壁厚" = 3.0           # mm

# ─────── 总长与折弯 ───────
"横拉杆总长" = 600.0         # mm  外端面到外端面
                             #   ★  同步模型实测值（原按球心距推得 260，
                             #     建模后按实际装配布置定为 **600**）
"折角" = 6.0                 # °   主体管折弯（避让用）
"折点距转向节端" = 320.0      # mm  自转向节侧端面量起（同步模型，原 130）

# ─────── 派生 ───────
"主体管内孔" = "= 主体管外径 - 2 * 主体管壁厚"      # → 26
"主体管长度" = "= 横拉杆总长 - 2 * 球头座长度"      # → 134

["材料"]
"主体管材料" = "20号优质碳素结构钢"    # GB/T 699 无缝钢管；同下摆臂衬管，可焊性好
"球头座材料" = "20号优质碳素结构钢"

["_校验"]
"球头座配球头总成" = "= 球头座内孔 == 45.0"
"球头座外径大于内孔" = "= 球头座外径 > 球头座内孔"
"主体管长度为正" = "= 主体管长度 > 0"
"折点在主体管上" = "= 折点距转向节端 > 球头座长度"


